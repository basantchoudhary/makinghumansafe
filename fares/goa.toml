# Hand-collected fare facts for Goa. Every entry has a source link and the date it was checked.
# Nothing here is an estimate of ours. Where official figures conflict, all are listed.

checked = "2026-11-13"
summary = "Goa's official taxi fares are contested: different government documents and statements give different per-km rates, and app-based fares (GoaMiles) are disputed by taxi unions. That confusion is why overcharging is common. Buy a prepaid slip at the airport counter, never from touts, and agree the fare before you get in."

