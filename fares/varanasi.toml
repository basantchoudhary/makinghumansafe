# Hand-collected fare facts for Varanasi. Every entry has a source link and the date it was checked.
# Nothing here is an estimate of ours. Where official figures conflict, all are listed.

checked = "2026-11-13"
summary = "We found no officially notified per-km fare for Varanasi's autos, e-rickshaws or taxis; e-rickshaws mostly run shared on traffic-police-assigned routes at a per-seat fare. On busy days drivers multiply this: Amar Ujala reported ₹30-40 per seat becoming up to ₹100 on the Godowlia to Kal Bhairav route over New Year 2025. Ask locals for the usual per-seat fare, agree whether a quote is per person or for the whole vehicle, and note the driver's name and phone number, which must be displayed in the vehicle."

