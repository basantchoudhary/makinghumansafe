# Hand-collected fare facts for Delhi. Every entry has a source link and the date it was checked.
# Nothing here is an estimate of ours. Where official figures conflict, all are listed.

checked = "2026-11-13"
summary = "Delhi's government-notified meter fares (January 2023, the latest revision found) are ₹30 for the first 1.5 km then ₹11 per km for autos, and ₹40 at meter-down then ₹17 per km (non-AC) or ₹20 per km (AC) for taxis; news reports differ on whether the taxi meter-down covers the first 1 km or 1.5 km. The common trap is airport touts who charge inflated flat fares or invent stories (one told a passenger Delhi had heavy protests) to steer tourists elsewhere. Insist on the meter, book only from the official prepaid booth or an app, and report problems to the Traffic Helpline 1095."

