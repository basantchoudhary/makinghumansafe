text = "Delhi Police arrested 264 touts at IGI Airport in 2023 and 540 in 2024, and warned against booking from non-prepaid taxi booths. In one case a foreign national was charged ₹2,500 for a taxi ride from the airport to Chittaranjan Park, about 15 km away."
