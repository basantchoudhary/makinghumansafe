[[fact]]
text = "A separate April 2026 report puts Shivpuri (16 km) rafting at about ₹1,000 per person and short stretches like Brahmpuri (9–10 km) at ₹500 to ₹800, slightly different from the ₹1,020 and ₹620 reported elsewhere."
source = "Times Now Hindi"
url = "https://www.timesnowhindi.com/travel/rishikesh-river-rafting-season-other-details-article-154188941"

[[fact]]
text = "In April 2023 Uttarakhand Tourism Secretary Sachin Kurve said the state waived the river rafting fee for three years on all rivers except the Ganga, so the Ganga at Rishikesh still carries the fee."
source = "Drishti IAS"
url = "https://www.drishtiias.com/state-pcs-current-affairs/river-rafting-fare-waived-on-all-rivers-except-the-ganges"

[[fact]]
text = "The 15 July 2022 STA notification superseded the 18 February 2020 one; the Uttarakhand transport department's documents page lists both as 'Maximum fare rates for different categories of vehicles fixed by State Transport Authority'."
source = "Transport Department, Uttarakhand"
url = "https://transport.uk.gov.in/documents/page/27"
