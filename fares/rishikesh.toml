# Hand-collected fare facts for Rishikesh. Every entry has a source link and the date it was checked.
# Nothing here is an estimate of ours. Where official figures conflict, all are listed.

checked = "2026-11-13"
summary = "Uttarakhand's State Transport Authority fixes maximum fares for autos (₹60 for the first 2 km, then ₹18 per km) and per-km taxi rates, but we found no published fixed fare for the Dehradun airport or Haridwar to Rishikesh routes. Rafting prices were raised sharply in April 2026 (Shivpuri 16 km went from ₹350 to ₹1,020 per person), and reports give slightly different figures. Ask to see the per-km rate, agree the total before the ride, and pay rafting at a counter that issues a receipt."

