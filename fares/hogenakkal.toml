# Hand-collected fare facts for Hogenakkal. Every entry has a source link and the date it was checked.
# Nothing here is an estimate of ours. Where official figures conflict, all are listed.

checked = "2026-11-13"
summary = "The coracle fare at Hogenakkal is set by the government, but reports differ: older DT Next reports give ₹750 for four people, while 2025 and 2026 reports give ₹1,500 for a family of four or a round trip for five. The common overcharging pattern is oarsmen, especially unregistered ones, asking far above the fixed fare and taking longer routes. Settle the fare at the official counter before boarding and use only registered coracles. We found no sourced oil-massage rate."

