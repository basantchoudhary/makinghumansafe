[[fact]]
text = "On the Karnataka side of Hogenakkal, coracle riders were reported demanding ₹4,000 from tourists, against the ₹750 the Tamil Nadu government had set; the report says Karnataka had not fixed any coracle rate and tourists were threatened with being left midway in the water."
source = "Mysooru News"
url = "https://www.mysoorunews.com/?p=37834"

[[fact]]
text = "When rides resumed in 2015 under the Dharmapuri collector's supervision, life jackets were made mandatory, each coracle limited to four passengers or 400 kg, and children under 10 and people over 70 barred."
