text = "No polluting vehicles are allowed within 500 m of the Taj Mahal. Parking is at Shilpgram for the east gate and Amrood ka Teela for the west gate, with battery buses and golf carts from parking to the gate. UP Police helpline is 112."
source = "Taj Mahal official site (tajmahal.gov.in)"
