# Hand-collected fare facts for Agra. Every entry has a source link and the date it was checked.
# Nothing here is an estimate of ours. Where official figures conflict, all are listed.

checked = "2026-11-13"
summary = "We could not find an officially notified per-km fare for Agra's autos, e-rickshaws or taxis, so fares are negotiated; the one official figure is the Taj Mahal golf cart (₹25 for Indian citizens, free with a foreigner's entry ticket). Because there is no meter fare, the risk is an inflated quote or a currency mix-up. Agree the fare in rupees before the ride, and note that only non-polluting vehicles may go within 500 m of the Taj."

