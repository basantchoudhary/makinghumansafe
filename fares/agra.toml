[[fact]]
text = "In July 2026 an Agra taxi driver asked French tourists for ₹500 (an airport waiting charge) and accepted €50 instead; Agra Police traced him, recovered the 50 euros, returned it to the tourists and started proceedings. Always state and pay the fare in rupees."
