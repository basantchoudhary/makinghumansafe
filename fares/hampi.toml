[[fact]]
text = "The river ferry from Hampi to the Virupapura Gaddi / Hanumanahalli side costs ₹50 per crossing (it leaves when full), while going round by auto costs ₹1,200, so a driver offering the road route instead of the ferry is charging many times more."
source = "Wikivoyage"
url = "https://en.wikivoyage.org/wiki/Hampi"

[[fact]]
text = "Lower coracle prices of ₹150 for 30 minutes and ₹300 for 1 hour are seen online, against the ₹450 and ₹750 a blogger actually paid; the blogger notes the price depends on how well you bargain."
source = "Stories by Soumya (travel blog)"
