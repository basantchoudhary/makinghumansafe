# Hand-collected fare facts for Hampi. Every entry has a source link and the date it was checked.
# Nothing here is an estimate of ours. Where official figures conflict, all are listed.

checked = "2026-11-13"
summary = "We found no official fixed fare for Hampi autos or coracles; every figure below is a traveller-reported price, and they vary widely (a full-day auto was quoted ₹1,500 to ₹2,000 in Nov 2023, and coracle rides from ₹150 to ₹750 per person depending on the spot and length). The common pattern is negotiated prices with no rate card, so first-time visitors pay the top of the range. Take the local bus from Hospet (₹17 in April 2023) and fix the price and ride length before boarding an auto or coracle."

