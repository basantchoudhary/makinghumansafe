# Places covered. Each place has spots (popular points) located from Overture place records by name,
# never typed in by hand. Help nearby is computed around each spot.

[goa]
name = "Goa"
activities = ["swimming", "water_sports", "waterfall", "road", "nightlife", "crime", "scam"]            # activity cards shown (keys of activities.toml)
country = "IN"
state = "Goa"
districts = ["North Goa", "South Goa"]            # incidents must be in one of these (model names it, rule checks it)
bbox = [73.65, 14.88, 74.35, 15.82]          # west, south, east, north (whole state)
wikivoyage_page = "Goa"
wikivoyage_sections = ["Stay safe", "By taxi", "Emergency services"]
alert_keywords = ["goa"]                       # NDMA SACHET alerts mentioning these
news_queries = ['"goa" taxi tourists', '"goa" drowned beach', '"goa" tourists cheated', '"calangute"', '"baga"']
# Local publisher RSS feeds (latest items only, so fetch often and keep history). Headlines + links only.
news_feeds = [["Times of India, Goa", "https://timesofindia.indiatimes.com/rssfeeds/3012535.cms"],
              ["Herald Goa", "https://www.heraldgoa.in/rss"]]
spots = ["Calangute Beach", "Baga Beach", "Anjuna Beach", "Palolem Beach, Goa", "Colva Beach", "Arambol Beach", "Dudhsagar Falls", "Manohar International Airport", "Goa International Airport"]

# ---- Tier 1c places (13 Nov 2026). Dudhsagar stays inside Goa (it is a Goa spot). ----
# news_require: for feeds that cover a wider area, an item must also mention one of these.
# Spots are matched to Overture names; misses are listed in data/<place>/help.json with candidates.

